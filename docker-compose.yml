services:
  web:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - course_manager_data:/app/data

volumes:
  course_manager_data:
